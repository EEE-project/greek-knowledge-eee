[project]
name = "greek-knowledge-eee"
version = "0.2.1"
description = "A Greek language & culture knowledge base (Open Knowledge Format) for the EEE project"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Oleg Sadov", email = "oleg.sadov@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "eee-project==1.6.0",
    "ancient-greek-backend-eee>=2.0.0",
    "modern-greek-backend-eee>=1.0.0",
    "modern-greek-inflexion-eee>=2.1.10",
    "pyyaml>=6.0.3",
    "defusedxml>=0.7.1",
    "llm-backend-eee",
    "beta-code>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# llm-backend-eee is not published to PyPI (confirmed: pypi.org/pypi/llm-backend-eee/json
# returns 404) -- only available via Codeberg. Pinned to the v0.2.1 tag (not a bare
# unpinned URL) because this integration relies on a specific method signature/return-type
# contract (LLMBackend.inflect(lemma, features, pos, language=...) -> set[str]); an
# unpinned default-branch dependency would let a future commit silently change that
# contract out from under this code.
[tool.uv.sources]
llm-backend-eee = { git = "https://codeberg.org/EEE-project/llm-backend-eee", tag = "v0.2.1" }

# Deliberate deviation from this org's usual `src/<pkg_name>` layout: this
# repo's own code lives at `okfbuild/` (repo root), matching the directory
# tree in sections/section-01-foundation.md. Keeps `import okfbuild...`
# working from test files with no extra sys.path/conftest.py wiring. Named
# `okfbuild`, not `build`, to avoid colliding with PyPA's own `build`
# package (`pip install build; python -m build`).
[tool.hatch.build.targets.wheel]
packages = ["okfbuild"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real network/data pilot acceptance tests (uv run pytest -m integration)",
    "paid_llm_api: tests that call a real, billed LLM API -- gated by --run-paid-llm-tests plus env vars, see README (uv run pytest --run-paid-llm-tests -m paid_llm_api)",
]
